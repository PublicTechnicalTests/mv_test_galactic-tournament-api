name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - release/**
      - hotfix/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Init Phase: Setup Java and Maven
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Display Java & Maven Versions
        run: |
          java -version
          mvn --version

      # Build & Test Phase
      - name: Build & Test with Maven
        run: mvn clean verify --batch-mode --show-version --errors
        continue-on-error: false

      # Coverage Gate Phase
      - name: Extract JaCoCo Coverage
        id: jacoco
        if: always()
        run: |
          if [ -f "target/site/jacoco/index.html" ]; then
            COVERAGE=$(grep -oP 'Total<[^>]*>([0-9.]+)%' target/site/jacoco/index.html | head -1 | grep -oP '[0-9.]+' || echo "0")
            echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
            echo "### JaCoCo Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "Coverage: **${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Coverage is below 80% threshold!" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "✅ Coverage meets 80% minimum!" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ JaCoCo report not found!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # Upload Artifacts
      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

      # Post PR Comment with Results
      - name: Post Coverage Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.jacoco.outputs.coverage }}';
            const buildStatus = '${{ job.status }}';
            const comment = `## Build & Test Results
            
            - **Status**: ${buildStatus === 'success' ? '✅ Passed' : '❌ Failed'}
            - **JaCoCo Coverage**: ${coverage}%
            - **Minimum Required**: 80%
            
            [View JaCoCo Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check --batch-mode
        continue-on-error: true

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: target/dependency-check-report.html
          retention-days: 30
  container-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

       - name: Extract Metadata
        id: meta
        run: |
          IMAGE_NAME=${{ github.repository }}
          IMAGE_TAG=${{ github.sha }}
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IMAGE_TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "### Docker Image Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${IMAGE_NAME}" >> $GITHUB_STEP_SUMMARY
           echo "- **Tag**: ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY

       - name: Build Docker Image (Multi-stage)
         uses: docker/build-push-action@v5
         with:
           context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, security-scan]

    steps:
      - name: Check Build Status
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "❌ Build and test phase failed"
            exit 1
          fi
          if [ "${{ needs.security-scan.result }}" != "success" ] && [ "${{ needs.security-scan.result }}" != "skipped" ]; then
            echo "⚠️ Security scan had warnings, review before merging"
          else
            echo "✅ All critical checks passed successfully!"
          fi

